<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Bandejas — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #171b26;
      --border: rgba(255, 255, 255, .07);
      --border-hi: rgba(99, 102, 241, .5);
      --indigo: #6366f1;
      --indigo-hi: #818cf8;
      --text: #e2e8f0;
      --muted: #64748b;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin:0; padding:0 }
    body { font-family: var(--sans); background: var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center }
    .glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,.12) 0%, transparent 70%); top:-200px; left:50%; transform:translateX(-50%); pointer-events:none }
    .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2.25rem 1.75rem; box-shadow:0 40px 80px -20px rgba(0,0,0,.6) }
    .logo-wrap { display:flex; gap:12px; align-items:center; margin-bottom:18px }
    .logo-icon { width:44px; height:44px; background:linear-gradient(135deg,var(--indigo),#a78bfa); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff }
    .logo-title { font-family:var(--mono); font-weight:500; font-size:.95rem }
    .logo-sub { font-size:.72rem; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.08em }
    h1 { font-size:1.3rem; margin-bottom:.4rem }
    .subtitle { color:var(--muted); margin-bottom:1.25rem }
    .field { margin-bottom:1rem }
    .field-label { display:flex; justify-content:space-between; font-family:var(--mono); font-size:.68rem; color:var(--muted); text-transform:uppercase }
    .input-wrap { position:relative }
    .input-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted) }
    .field-input { width:100%; padding:.85rem 1rem .85rem 2.6rem; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,.02); color:var(--text); font-family:var(--mono) }
    .field-input::placeholder { color:var(--muted) }
    .toggle-pass { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer }
    #error-msg { display:none; background: rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); padding:.7rem 1rem; border-radius:10px; color:#f87171; margin-bottom:1rem }
    #error-msg.show { display:flex; gap:8px; align-items:center }
    .btn { width:100%; background:var(--indigo); color:#fff; border:none; padding:.95rem; border-radius:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px }
    .btn:disabled { opacity:.6; cursor:not-allowed }
    .card-footer { margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted) }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="card" id="login-card">
    <div class="logo-wrap">
      <div class="logo-icon"><i class="fa-solid fa-compact-disc"></i></div>
      <div class="logo-text">
        <div class="logo-title">CONTROL BANDEJAS</div>
        <div class="logo-sub">Evidencia a Bordo</div>
      </div>
    </div>

    <div id="login-form-wrap">
      <h1>Acceso</h1>
      <p class="subtitle">Introduce tu clave de colaborador y contraseña para continuar.</p>

      <div id="error-msg"><i class="fa-solid fa-triangle-exclamation"></i><span id="error-txt">Credenciales incorrectas.</span></div>

      <div class="field">
        <label class="field-label" for="clave">Clave de colaborador</label>
        <div class="input-wrap">
          <input id="clave" type="text" class="field-input" placeholder="Ej. 1003633" autocomplete="username">
          <i class="fa-solid fa-id-badge input-icon"></i>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <input id="password" type="password" class="field-input" placeholder="••••••••" autocomplete="current-password">
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="toggle-pass" onclick="togglePass()" id="toggle-pass-btn" title="Mostrar contraseña"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
        </div>
      </div>

      <button class="btn" id="btn-login"><i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar</button>
    </div>

    <div class="card-footer">
      <span>Estado: <strong style="margin-left:8px">Sistema</strong></span>
      <span style="font-size:.8rem">v1.0 · 2026</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../tab/supabase-auth.js"></script>
 <script>

    function getRedirect() {
      const params = new URLSearchParams(window.location.search);
      let redirectPath = params.get('redirect') || 'cctv/bandejas2/index.html';
      
      if (redirectPath.startsWith('/')) {
        redirectPath = redirectPath.substring(1);
      }
      return redirectPath;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('tecnico')) {
        window.location.href = getRedirect();
      }
    });

    const btn = document.getElementById('btn-login');
    const errBox = document.getElementById('error-msg');
    const errTxt = document.getElementById('error-txt');

    async function handleLogin() {
      const clave = document.getElementById('clave').value.trim();
      const password = document.getElementById('password').value;
      
      errBox.classList.remove('show');
      document.getElementById('clave').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!clave) { 
        document.getElementById('clave').classList.add('error'); 
        errTxt.textContent = 'Ingresa tu clave de colaborador.'; 
        errBox.classList.add('show'); 
        return; 
      }

      btn.disabled = true; 
      btn.innerHTML = '<span style="display:inline-block;animation:spin .7s linear infinite"><i class="fa-solid fa-circle-notch"></i></span> Verificando...';

      try {
        const res = await window.supabaseAuth.signInWithCollab(clave, password);
        if (res.error) throw res.error;

        // Intentar leer el perfil
        try {
          const profile = await window.supabaseAuth.getProfile();
          if (profile?.clave_colaborador) localStorage.setItem('tecnico', profile.clave_colaborador);
          if (profile?.nombre) localStorage.setItem('nombre_tecnico', profile.nombre);
          if (profile?.base) localStorage.setItem('base', profile.base);
        } catch (e) { /* ignorar error de perfil */ }

        // Login exitoso: brincamos al index
        window.location.href = getRedirect();
        
      } catch (e) {
        console.error(e);
        errTxt.textContent = (e && e.message) ? e.message : 'Error autenticando.';
        errBox.classList.add('show');
        btn.disabled = false; 
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar';
      }
    }

    function togglePass() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') { 
        inp.type = 'text'; 
        icon.className = 'fa-solid fa-eye-slash'; 
      } else { 
        inp.type = 'password'; 
        icon.className = 'fa-solid fa-eye'; 
      }
    }

    btn.addEventListener('click', handleLogin);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>

</body>

</html>
