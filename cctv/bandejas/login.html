<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Bandejas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#f3f4f6}
    .card{background:white;padding:26px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.08);width:360px}
    h1{margin:0 0 8px;font-size:18px}
    label{display:block;font-size:12px;color:#374151;margin-top:12px}
    input{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-top:6px}
    .btn{margin-top:16px;background:#2563eb;color:white;border:none;padding:10px;border-radius:8px;width:100%;font-weight:600;cursor:pointer}
    .hint{font-size:12px;color:#6b7280;margin-top:8px}
    .error{color:#b91c1c;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Acceso - Bandejas</h1>
    <div class="hint">Introduce tu clave de colaborador. La cuenta será <b>clave@gho.mx</b>.</div>
    <label for="collab">Clave de colaborador</label>
    <input id="collab" inputmode="numeric" pattern="[0-9]*" placeholder="1234567" autofocus>

    <label for="password">Contraseña (opcional)</label>
    <input id="password" type="password" placeholder="Si se deja vacío se usa la clave">

    <button id="btnLogin" class="btn">Entrar</button>

    <div id="error" class="error" role="alert" style="display:none"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../tab/supabase-auth.js"></script>
  <script>
    const btn = document.getElementById('btnLogin');
    const errEl = document.getElementById('error');

    function getRedirect() {
      const params = new URLSearchParams(window.location.search);
      return params.get('redirect') || 'index.html';
    }

    btn.addEventListener('click', async () => {
      errEl.style.display = 'none';
      const collab = document.getElementById('collab').value.trim();
      const password = document.getElementById('password').value;
      if (!collab) { errEl.innerText = 'Ingresa tu clave de colaborador'; errEl.style.display = 'block'; return; }

      try {
        const res = await window.supabaseAuth.signInWithCollab(collab, password);
        if (res.error) {
          errEl.innerText = res.error.message || 'Error autenticando'; errEl.style.display = 'block';
          return;
        }
        window.location.href = getRedirect();
      } catch (e) {
        console.error(e);
        errEl.innerText = e.message || 'Error desconocido'; errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
