<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control de Bandejas</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --bg: #ebedf2;
      --sidebar: #0a1220;
      --sidebar-soft: #101b2d;
      --surface: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef3fb;
      --line: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --text-soft: #5b6474;
      --muted: #7a8696;
      --blue: #2d7cf6;
      --blue-2: #1f5bd6;
      --green: #2dc071;
      --orange: #f59e0b;
      --purple: #7c4dff;
      --red: #ef4444;
      --shadow: 0 30px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    a { text-decoration: none; }

    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(180deg, #eff3f9 0%, #eef2f8 100%);
    }

    .sidebar {
      width: 240px;
      min-width: 240px;
      background: linear-gradient(180deg, var(--sidebar) 0%, #090f1a 100%);
      color: #f8fafc;
      padding: 18px 14px 18px;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #dfe8f5);
      color: #111827;
      font-size: 1.05rem;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    .brand-name {
      font-size: 1.05rem;
      line-height: 1;
    }

    .side-search {
      margin: 18px 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      font-size: 0.92rem;
    }

    .side-search i { opacity: 0.75; }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      overflow: auto;
      padding-right: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      color: rgba(255,255,255,0.8);
      transition: background 0.2s ease, transform 0.2s ease;
      font-size: 0.98rem;
      border: 1px solid transparent;
      user-select: none;
    }

    .nav-item:hover {
      background: rgba(148, 163, 184, 0.08);
      transform: translateX(1px);
    }

    .nav-item.active {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.08);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .nav-item i {
      width: 18px;
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 0.94rem;
    }

    .nav-item .label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item.mobile-only {
      display: none;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tiny-badge {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3f9 100%);
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 28px;
      background: rgba(255,255,255,0.35);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    .title-wrap strong {
      color: var(--text);
      font-size: 1.12rem;
    }

    .workspace-btn {
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: rgba(255,255,255,0.6);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
    }

    .content {
      flex: 1;
      padding: 22px 22px 22px 22px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .viewport-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .viewport-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(244,247,251,0.96));
    }

    .empty-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(45,124,246,0.12), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,0.74), rgba(241,246,252,0.92));
      color: var(--text);
    }

    .empty-card {
      width: min(70%, 820px);
      padding: 28px 30px;
      border-radius: 26px;
      background: rgba(255,255,255,0.66);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 20px 40px rgba(15,23,42,0.08);
      backdrop-filter: blur(6px);
      display: grid;
      gap: 18px;
      justify-items: center;
      text-align: center;
    }

    .empty-icon {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(45,124,246,0.12), rgba(124,77,255,0.1));
      color: var(--blue);
      font-size: clamp(2rem, 2vw, 2.5rem);
      box-shadow: inset 0 0 0 1px rgba(45,124,246,0.08);
    }

    .empty-card h2 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.8rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    .empty-card p {
      margin: 0;
      max-width: 620px;
      color: var(--text-soft);
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .empty-mini {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .mini-pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.04);
      color: var(--text-soft);
      border: 1px solid rgba(15,23,42,0.06);
      font-size: 0.84rem;
      font-weight: 600;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
        background: #f2f2f7;
      }

      .app-shell {
        display: none;
      }

      .mobile-shell {
        display: block;
      }

      .mobile-shell {
        min-height: 100vh;
        background: #f3f4f6;
        color: #1f2937;
      }

      .mobile-topbar {
        height: 58px;
        background: #151a21;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
      }

      .mobile-menu-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .mobile-title {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .mobile-home {
        padding: 18px 16px 26px;
      }

      .mobile-greeting {
        margin: 0 0 18px;
        font-size: clamp(2rem, 6vw, 2.7rem);
        line-height: 1.1;
        letter-spacing: -0.06em;
        font-weight: 500;
        color: #111827;
      }

      .mobile-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .mobile-card {
        min-height: 132px;
        border-radius: 14px;
        padding: 12px 10px 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff;
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(17,24,39,0.04);
        text-decoration: none;
      }

      .mobile-card.primary { background: linear-gradient(180deg, #1f9ae5, #1f7de6); }
      .mobile-card.success { background: linear-gradient(180deg, #34c759, #10b981); }
      .mobile-card.purple { background: linear-gradient(180deg, #8b5cf6, #7c3aed); }
      .mobile-card.orange { background: linear-gradient(180deg, #f59e0b, #f97316); }
      .mobile-card.turquoise { background: linear-gradient(180deg, #2dd4bf, #14b8a6); }

      .mobile-card-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.18);
        font-size: 1.1rem;
      }

      .mobile-card label {
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .mobile-panel {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 22px rgba(15, 23, 42, 0.04);
        border: 1px solid rgba(15, 23, 42, 0.04);
        overflow: hidden;
      }

      .mobile-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 14px 10px;
        font-weight: 700;
        color: #111827;
      }

      .mobile-section-header .chevron {
        font-size: 0.95rem;
        color: #6b7280;
      }

      .mobile-list {
        display: flex;
        flex-direction: column;
      }

      .mobile-list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px;
        border-top: 1px solid rgba(15, 23, 42, 0.06);
        color: #1f2937;
        text-decoration: none;
      }

      .mobile-item-title {
        font-size: 0.98rem;
        font-weight: 500;
      }

      .mobile-item-meta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        border-radius: 8px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .mobile-item-meta.blue {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .mobile-item-meta.green {
        background: #dcfce7;
        color: #15803d;
      }

      .mobile-item-meta.purple {
        background: #ede9fe;
        color: #6d28d9;
      }

      .mobile-item-meta.orange {
        background: #ffedd5;
        color: #c2410c;
      }
    }

    @media (min-width: 861px) {
      .mobile-shell {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-topbar">
      <div class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></div>
      <div class="mobile-title">Home</div>
      <div style="width:32px; height:32px; visibility:hidden;"></div>
    </header>

    <main class="mobile-home">
      <h1 class="mobile-greeting" id="mobileGreeting">Buenos días, Alex.</h1>

      <div class="mobile-grid" id="mobileGrid"></div>

      <section class="mobile-panel">
        <div class="mobile-section-header">
          <span>Operaciones</span>
          <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
        </div>
        <div class="mobile-list" id="mobileList"></div>
      </section>
    </main>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div class="brand-name">Tecnología a Bordo</div>
      </div>

      <div class="side-search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <nav class="nav-list" id="navList">

        <a class="nav-item mobile-only" href="registrarcambio.html">
          <i class="fa-solid fa-clipboard-check"></i>
          <span class="label">Registrar Cambio</span>
        </a>
        <a class="nav-item" href="owalert.html">
          <i class="fa-solid fa-shield-halved"></i>
          <span class="label">Alertas</span>
        </a>
        <a class="nav-item" href="historial.html">
          <i class="fa-regular fa-clock"></i>
          <span class="label">Historial de Cambios</span>
        </a>
        <a class="nav-item" href="movimientos.html">
          <i class="fa-solid fa-list"></i>
          <span class="label">Movimientos</span>
        </a>
        <a class="nav-item" href="inventario.html">
          <i class="fa-solid fa-boxes-stacked"></i>
          <span class="label">Inventario</span>
        </a>
       
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item" style="pointer-events:none; opacity:0.9;">
          <div class="tiny-badge"></div>
          <span class="label">Grupo Herradura Occidente</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap">
          <strong>Bandejas de Grabación</strong>
          <span>Base Operativa</span>
        </div>
        <button class="workspace-btn">Cerrar Sesión</button>
      </header>

      <section class="content">
        <div class="viewport-frame">
          <iframe title="Vista principal" srcdoc='<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <style>
                :root {
                  --bg1: rgba(15, 23, 42, 0.04);
                  --bg2: rgba(255,255,255,0.9);
                  --line: rgba(15,23,42,0.08);
                  --text: #0f172a;
                  --muted: #5b6474;
                  --blue: #2d7cf6;
                }
                * { box-sizing: border-box; }
                html, body { height: 100%; margin: 0; }
                body {
                  font-family: Inter, "Segoe UI", sans-serif;
                  background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(224,231,239,0.7));
                  display: grid;
                  place-items: center;
                  color: var(--text);
                }
                .card {
                  width: min(680px, 82%);
                  background: rgba(255,255,255,0.72);
                  border: 1px solid var(--line);
                  border-radius: 28px;
                  box-shadow: 0 26px 60px rgba(15,23,42,0.08);
                  backdrop-filter: blur(8px);
                  padding: 28px 26px;
                  text-align: center;
                }
                .icon {
                  width: 92px;
                  height: 92px;
                  margin: 0 auto 18px;
                  border-radius: 26px;
                  display: grid;
                  place-items: center;
                  background: linear-gradient(135deg, rgba(45,124,246,0.12), rgba(124,77,255,0.08));
                  color: var(--blue);
                  font-size: 2.5rem;
                }
                h2 {
                  margin: 0 0 12px;
                  font-size: clamp(2rem, 3vw, 3rem);
                  letter-spacing: -0.06em;
                  line-height: 1.08;
                }
                p {
                  margin: 0;
                  color: var(--muted);
                  line-height: 1.7;
                  font-size: 1.02rem;
                }
                .chips {
                  margin-top: 22px;
                  display: flex;
                  flex-wrap: wrap;
                  justify-content: center;
                  gap: 10px;
                }
                .chip {
                  background: rgba(15,23,42,0.04);
                  border: 1px solid rgba(15,23,42,0.06);
                  border-radius: 999px;
                  padding: 9px 12px;
                  font-size: 0.8rem;
                  color: var(--muted);
                  font-weight: 600;
                }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="icon">✦</div>
                <h2>Tecnología a Bordo</h2>
                <p>La vista principal se carga aquí. Selecciona una opción del menú para abrir la información correspondiente.</p>
                <div class="chips">
                  <span class="chip">Flota</span>
                  <span class="chip">Seguridad</span>
                </div>
              </div>
            </body>
            </html>'></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../tab/supabase-auth.js"></script>
  <script>
    function isMobileDevice() {
      return window.matchMedia('(max-width: 860px)').matches || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function updateMobileMenuRules() {
      const mobileOnly = document.querySelector('.nav-item.mobile-only');
      if (!mobileOnly) return;
      if (isMobileDevice()) {
        mobileOnly.style.display = 'flex';
      } else {
        mobileOnly.style.display = 'none';
      }
    }

    const mobileOptions = [
      { label: 'Registrar Cambio', href: 'registrarcambio.html', icon: 'fa-solid fa-clipboard-check', className: 'primary' },
      { label: 'Alertas', href: 'owalert.html', icon: 'fa-solid fa-shield-halved', className: 'success' },
      { label: 'Historial', href: 'historial.html', icon: 'fa-regular fa-clock', className: 'purple' },
      { label: 'Movimientos', href: 'movimientos.html', icon: 'fa-solid fa-list', className: 'orange' },
      { label: 'Inventario', href: 'inventario.html', icon: 'fa-solid fa-boxes-stacked', className: 'turquoise' }
    ];

    function renderMobileCards() {
      const grid = document.getElementById('mobileGrid');
      if (!grid) return;

      const cards = mobileOptions.slice(0, 3).map((item) => `
        <a class="mobile-card ${item.className}" href="${item.href}">
          <div class="mobile-card-icon"><i class="${item.icon}"></i></div>
          <label>${item.label}</label>
        </a>
      `).join('');

      grid.innerHTML = cards;
    }

    function renderMobileList() {
      const list = document.getElementById('mobileList');
      if (!list) return;

      const items = [
        { label: 'Registrar Cambio', href: 'registrarcambio.html', count: 1, badgeClass: 'red' },
        { label: 'Alertas', href: 'owalert.html', count: 3, badgeClass: 'blue' },
        { label: 'Historial de Cambios', href: 'historial.html', count: 2, badgeClass: 'green' },
        { label: 'Movimientos Recientes', href: 'movimientos.html', count: 4, badgeClass: 'purple' },
        { label: 'Inventario', href: 'inventario.html', count: 2, badgeClass: 'orange' }
      ];

      list.innerHTML = items.map((item) => `
        <a class="mobile-list-item" href="${item.href}">
          <span class="mobile-item-title">${item.label}</span>
          <span class="mobile-item-meta ${item.badgeClass}">${item.count}</span>
        </a>
      `).join('');
    }

    function updateGreeting() {
      const name = localStorage.getItem('nombre_tecnico') || 'Alex';
      const greeting = document.getElementById('mobileGreeting');
      if (greeting) greeting.textContent = `Buenos días, ${name}.`;
    }

    const navLinks = document.querySelectorAll('.nav-item');
    navLinks.forEach((link) => {
      link.addEventListener('click', function () {
        navLinks.forEach((item) => item.classList.remove('active'));
        this.classList.add('active');
      });
    });

    window.addEventListener('load', function () {
      updateMobileMenuRules();
      renderMobileCards();
      renderMobileList();
      updateGreeting();
      if (window.supabaseAuth && window.supabaseAuth.requireAuth) {
        window.supabaseAuth.requireAuth().catch(err => console.error('Auth check failed:', err));
      }
    });

    window.addEventListener('resize', updateMobileMenuRules);
  </script>
</body>
</html>
