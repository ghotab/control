<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control de Bandejas</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --bg: #ebedf2;
      --sidebar: #0a1220;
      --sidebar-soft: #101b2d;
      --surface: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef3fb;
      --line: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --text-soft: #5b6474;
      --muted: #7a8696;
      --blue: #2d7cf6;
      --blue-2: #1f5bd6;
      --green: #2dc071;
      --orange: #f59e0b;
      --purple: #7c4dff;
      --red: #ef4444;
      --shadow: 0 30px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    a { text-decoration: none; }

    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(180deg, #eff3f9 0%, #eef2f8 100%);
    }

    .sidebar {
      width: 240px;
      min-width: 240px;
      background: linear-gradient(180deg, var(--sidebar) 0%, #090f1a 100%);
      color: #f8fafc;
      padding: 18px 14px 18px;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #dfe8f5);
      color: #111827;
      font-size: 1.05rem;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    .brand-name {
      font-size: 1.05rem;
      line-height: 1;
    }

    .side-search {
      margin: 18px 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      font-size: 0.92rem;
    }

    .side-search i { opacity: 0.75; }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      overflow: auto;
      padding-right: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      color: rgba(255,255,255,0.8);
      transition: background 0.2s ease, transform 0.2s ease;
      font-size: 0.98rem;
      border: 1px solid transparent;
      user-select: none;
    }

    .nav-item:hover {
      background: rgba(148, 163, 184, 0.08);
      transform: translateX(1px);
    }

    .nav-item.active {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.08);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .nav-item i {
      width: 18px;
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 0.94rem;
    }

    .nav-item .label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item.mobile-only {
      display: none;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tiny-badge {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3f9 100%);
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 28px;
      background: rgba(255,255,255,0.35);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    .title-wrap strong {
      color: var(--text);
      font-size: 1.12rem;
    }

    .workspace-btn {
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: rgba(255,255,255,0.6);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
    }

    .content {
      flex: 1;
      padding: 22px 22px 22px 22px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .viewport-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .viewport-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(244,247,251,0.96));
    }

    .empty-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(45,124,246,0.12), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,0.74), rgba(241,246,252,0.92));
      color: var(--text);
    }

    .empty-card {
      width: min(70%, 820px);
      padding: 28px 30px;
      border-radius: 26px;
      background: rgba(255,255,255,0.66);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 20px 40px rgba(15,23,42,0.08);
      backdrop-filter: blur(6px);
      display: grid;
      gap: 18px;
      justify-items: center;
      text-align: center;
    }

    .empty-icon {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(45,124,246,0.12), rgba(124,77,255,0.1));
      color: var(--blue);
      font-size: clamp(2rem, 2vw, 2.5rem);
      box-shadow: inset 0 0 0 1px rgba(45,124,246,0.08);
    }

    .empty-card h2 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.8rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    .empty-card p {
      margin: 0;
      max-width: 620px;
      color: var(--text-soft);
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .empty-mini {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .mini-pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.04);
      color: var(--text-soft);
      border: 1px solid rgba(15,23,42,0.06);
      font-size: 0.84rem;
      font-weight: 600;
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app-shell {
        display: block;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 18px 14px 14px;
      }

      .brand {
        padding-top: 6px;
        margin-bottom: 16px;
      }

      .side-search {
        margin: 0 4px 14px;
      }

      .nav-list {
        gap: 8px;
      }

      .nav-item {
        padding: 14px 14px;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .nav-item.mobile-only {
        display: flex;
      }

      .main {
        min-height: calc(100vh - 320px);
        background: #f2f4f8;
      }

      .topbar {
        padding: 0 16px;
        height: 64px;
      }

      .title-wrap {
        font-size: 0.8rem;
      }

      .workspace-btn {
        display: none;
      }

      .content {
        padding: 14px;
      }

      .viewport-frame {
        border-radius: 18px;
        min-height: 420px;
      }

      .empty-card {
        width: min(88%, 520px);
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../tab/supabase-auth.js"></script>
  <script>
    function isMobileDevice() {
      return window.matchMedia('(max-width: 860px)').matches || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function updateMobileMenuRules() {
      const mobileOnly = document.querySelector('.nav-item.mobile-only');
      if (!mobileOnly) return;
      if (isMobileDevice()) {
        mobileOnly.style.display = 'flex';
      } else {
        mobileOnly.style.display = 'none';
      }
    }

    const navLinks = document.querySelectorAll('.nav-item');
    navLinks.forEach((link) => {
      link.addEventListener('click', function () {
        navLinks.forEach((item) => item.classList.remove('active'));
        this.classList.add('active');
      });
    });

    window.addEventListener('load', function () {
      updateMobileMenuRules();
      if (window.supabaseAuth && window.supabaseAuth.requireAuth) {
        window.supabaseAuth.requireAuth().catch(err => console.error('Auth check failed:', err));
      }
    });

    window.addEventListener('resize', updateMobileMenuRules);
  </script>
