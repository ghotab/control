<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de Conexión</title>
<style>
    body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 30px 20px; }
    button { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border: none; border-radius: 12px; margin-bottom: 12px; }
    .b1 { background: #007aff; color: white; }
    .b2 { background: #34c759; color: white; }
    #resultado { background: white; border-radius: 12px; padding: 16px; margin-top: 20px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; min-height: 100px; border: 1px solid #d1d1d6; }
</style>
</head>
<body>

<h2>Diagnóstico de Conexión</h2>

<button class="b1" onclick="pruebaSinHeaders()">Prueba 1: Fetch simple (sin headers)</button>
<button class="b2" onclick="pruebaConHeaders()">Prueba 2: Fetch con apikey (como el form real)</button>

<div id="resultado">Toca un botón para empezar...</div>

<script>
const SUPABASE_URL = "https://zygisljwmxoqdplsuzjw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5Z2lzbGp3bXhvcWRwbHN1emp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTE0OTYsImV4cCI6MjA5ODQyNzQ5Nn0.XeHFgDPGN5t0-6Fo1asEXD_XjGRK_N4Jiz706A3u6yg";

function mostrar(texto) {
    document.getElementById('resultado').innerText = texto;
}

async function pruebaSinHeaders() {
    mostrar("Probando fetch simple...");
    try {
        const res = await fetch(SUPABASE_URL + "/rest/v1/");
        const texto = await res.text();
        mostrar("✅ PRUEBA 1 OK\n\nStatus: " + res.status + "\n\nRespuesta:\n" + texto);
    } catch (e) {
        mostrar("❌ PRUEBA 1 FALLÓ\n\nTipo: " + e.name + "\nMensaje: " + e.message + "\n\nStack:\n" + (e.stack || "sin stack"));
    }
}

async function pruebaConHeaders() {
    mostrar("Probando fetch con apikey (igual que el formulario real)...");
    try {
        const res = await fetch(SUPABASE_URL + "/rest/v1/tbl_CambioBandeja?select=id_cambio&limit=1", {
            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY
            }
        });
        const texto = await res.text();
        mostrar("✅ PRUEBA 2 OK\n\nStatus: " + res.status + "\n\nRespuesta:\n" + texto);
    } catch (e) {
        mostrar("❌ PRUEBA 2 FALLÓ\n\nTipo: " + e.name + "\nMensaje: " + e.message + "\n\nStack:\n" + (e.stack || "sin stack") +
                "\n\nURL de esta página:\n" + window.location.href);
    }
}
</script>

</body>
</html>
