<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riesgos de Sobreescritura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --table-cols: 100px 180px 1fr 120px 90px 140px;
            --ink: #16202b;
            --ink-soft: #3a4552;
            --paper: #eef0f3;
            --surface: #ffffff;
            --rule: #d3d8de;
            --amber: #e2900f;
            --amber-tint: #fbf1de;
            --teal: #0f6f66;
            --teal-tint: #e3efee;
            --rust: #b33f2e;
            --rust-tint: #f8e8e4;
            --gris: #8a94a0;
            --gris-tint: #eef0f3;
            --font-display: 'IBM Plex Sans Condensed', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        body { background-color: var(--paper); height: 100vh; overflow: hidden; display: flex; color: var(--ink); }
        :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

        /* --- RAIL DE CONTROL --- */
        .rail {
            width: 250px;
            flex-shrink: 0;
            background: var(--ink);
            color: var(--paper);
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .rail-eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8b99; margin-bottom: 4px; }
        .rail-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin-bottom: 24px; }
        .rail-nav-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7d8b99; margin: 20px 4px 8px; }

        .side-item {
            padding: 9px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            color: #b9c2cc; margin-bottom: 2px; border-left: 3px solid transparent;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .side-item:hover { background: rgba(255,255,255,0.05); }
        .side-item.active { background: rgba(226,144,15,0.12); color: var(--paper); border-left-color: var(--amber); font-weight: 600; }
        .side-item i { width: 16px; text-align: center; margin-right: 8px; }

        .badge { background: var(--rust); color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: .5px; font-family: var(--font-mono); }

        .rail-status { margin-top: auto; font-family: var(--font-mono); font-size: 11px; color: #7d8b99; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #29323d; }
        .rail-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
        .rail-status.ok .dot { background: var(--teal); }
        .rail-status.error .dot { background: var(--rust); }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .toolbar {
            height: 56px; background: var(--surface); border-bottom: 1px solid var(--rule);
            display: flex; align-items: center; padding: 0 24px; justify-content: space-between; flex-shrink: 0;
        }
        .toolbar-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
        .toolbar-title span { font-weight: 400; color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }

        .search-box { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; width: 250px; }
        .search-box input { border: none; background: transparent; outline: none; font-size: 13px; width: 100%; font-family: var(--font-body); }

        /* PESTAÑAS */
        .tabs { display: flex; background: var(--paper); padding: 3px; border-radius: 10px; margin: 16px 24px 0; flex-shrink: 0; border: 1px solid var(--rule); }
        .tab { flex: 1; text-align: center; padding: 7px; font-size: 12.5px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--ink-soft); }
        .tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(22,32,43,0.08); }

        .table-wrapper {
            background: var(--surface); margin: 16px 24px 24px; border-radius: 12px; border: 1px solid var(--rule);
            overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0;
        }

        .table-header {
            display: grid; grid-template-columns: var(--table-cols); align-items: center;
            padding: 13px 24px; gap: 18px; background: #f6f7f9; border-bottom: 1px solid var(--rule);
            font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink-soft);
            text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; position: sticky; top: 0; z-index: 5;
        }

        .scroll-area { flex: 1; overflow-y: auto; display: block; }

        .row-item {
            display: grid; grid-template-columns: var(--table-cols); align-items: center;
            padding: 15px 24px; gap: 18px; border-bottom: 1px solid #eef0f3;
            transition: background .15s ease; min-height: 58px;
        }
        .row-item:last-child { border-bottom: none; }
        .row-item:hover { background: #fafbfc; }
        .row-vacio { opacity: .55; }

        .loader-wrap { text-align: center; padding: 80px 20px; color: var(--ink-soft); }
        .loader-wrap p { margin-top: 15px; font-family: var(--font-mono); font-size: 12px; }

        .cell-bus { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.3px; }
        .cell-bandeja { font-family: var(--font-mono); font-weight: 600; color: var(--ink-soft); font-size: 12.5px; }
        .cell-base { font-size: 12px; color: var(--ink-soft); font-weight: 600; font-family: var(--font-mono); }
        .cell-dias { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; }
        .cell-dias.critico { color: var(--rust); }
        .cell-fecha { font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); }

        .progress-wrap { display: flex; flex-direction: column; gap: 4px; }
        .progress-head { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .4px; }
        .progress-bar { height: 7px; background: var(--paper); border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }

        /* --- SELECTOR DE BASE MÓVIL --- */
        .mobile-base-picker {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--rule); padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
        }
        .mob-picker-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; padding: 0 16px 8px; }
        .mob-picker-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
        .mob-picker-scroll::-webkit-scrollbar { display: none; }
        .mob-base-pill {
            flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
            background: var(--paper); color: var(--ink-soft); cursor: pointer; border: 1px solid var(--rule);
            white-space: nowrap; font-family: var(--font-body);
        }
        .mob-base-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

        @media (max-width: 850px) {
            .table-header { display: none; }
            .rail, .toolbar .search-box { display: none; }
            .mobile-base-picker { display: block; }
            body { background: var(--paper); }

            .table-wrapper { flex: none; overflow: visible; height: auto; min-height: 0; margin: 0; border-radius: 0; border: none; box-shadow: none; background: transparent; }
            .main-content { overflow-y: auto; overflow-x: hidden; }
            .scroll-area { flex: none; overflow: visible; height: auto; padding: 12px 16px 130px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }

            .row-item {
                display: flex !important; flex-direction: column !important; padding: 0 !important; margin: 0 !important; gap: 0 !important;
                border-radius: 14px !important; border: 1px solid var(--rule) !important; background: var(--surface) !important;
                box-shadow: 0 2px 8px rgba(22,32,43,0.05) !important; overflow: hidden;
            }
            .row-vacio { opacity: .6; }

            .card-mob-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px dashed var(--rule); }
            .cell-bus { font-size: 21px !important; font-weight: 700 !important; }
            .mob-status-pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: .4px; text-transform: uppercase; }

            .card-mob-progress { padding: 12px 16px; border-bottom: 1px dashed var(--rule); }
            .row-item .progress-wrap { display: none; }

            .card-mob-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 12px 16px 14px; gap: 12px 8px; }
            .card-mob-cell { display: flex; flex-direction: column; gap: 2px; }
            .card-mob-label { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; }
            .card-mob-value { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; color: var(--ink); }

            .row-item .cell-bandeja, .row-item .cell-base, .row-item .cell-dias, .row-item .cell-fecha { display: none; }
        }

        @media (min-width: 851px) {
            .card-mob-header, .card-mob-progress, .card-mob-grid { display: none; }
        }
        @media (max-width: 850px) {
            .row-item > .cell-bus:first-child { display: none; }
        }
    </style>
</head>
<body>

    <aside class="rail">
        <div class="rail-eyebrow">GHO · TECNOLOGÍA A BORDO</div>
        <div class="rail-title">Riesgos</div>

        <div class="rail-nav-label">Alertas</div>
        <div class="side-item active" onclick="setFiltro('todos', this)">
            <span><i class="fa-solid fa-grid-2"></i> Flota Completa</span>
        </div>
        <div class="side-item" onclick="setFiltro('critico', this)">
            <span><i class="fa-solid fa-triangle-exclamation" style="color:var(--rust)"></i> Riesgos Críticos</span>
            <span class="badge" id="badgeCritico">0</span>
        </div>
        <div class="side-item" onclick="setFiltro('vacio', this)">
            <span><i class="fa-solid fa-hdd" style="color:var(--gris)"></i> Sin Disco</span>
        </div>

        <div class="rail-nav-label">Bases Detectadas</div>
        <div id="listaBasesMenu"></div>

        <div id="status-text" class="rail-status"><span class="dot"></span> Sincronizando...</div>
    </aside>

    <div class="main-content">
        <header class="toolbar">
            <div class="toolbar-title">Riesgos de Sobreescritura <span>CCTV</span></div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--ink-soft)"></i>
                <input type="text" id="macSearch" placeholder="Buscar unidad..." oninput="syncInputs(this.value)">
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" id="tab-todos" onclick="setFiltro('todos')">Flota Completa</div>
            <div class="tab" id="tab-critico" onclick="setFiltro('critico')">Riesgos Críticos</div>
            <div class="tab" id="tab-vacio" onclick="setFiltro('vacio')">Sin Disco</div>
        </div>

        <div class="table-wrapper">
            <div class="table-header">
                <div>Unidad</div>
                <div>Bandeja</div>
                <div>Progreso / Riesgo</div>
                <div>Base</div>
                <div>Días</div>
                <div>Instalación</div>
            </div>
            <main class="scroll-area" id="mainGrid">
                <div class="loader-wrap">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 30px;"></i>
                    <p>Analizando distribución...</p>
                </div>
            </main>
        </div>

        <div class="mobile-base-picker">
            <div class="mob-picker-label"><i class="fa-solid fa-location-dot"></i> &nbsp;Base</div>
            <div class="mob-picker-scroll" id="mobBasePicker">
                <button class="mob-base-pill active" onclick="setMobBase('todas', this)">Todas</button>
            </div>
        </div>
    </div>

<script>
    // ============================================================
    // CONEXIÓN A SUPABASE — variable "db", no "supabase"
    // ============================================================
    const SUPABASE_URL = "https://zygisljwmxoqdplsuzjw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5Z2lzbGp3bXhvcWRwbHN1emp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTE0OTYsImV4cCI6MjA5ODQyNzQ5Nn0.XeHFgDPGN5t0-6Fo1asEXD_XjGRK_N4Jiz706A3u6yg";

    let db = null;
    try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
        console.error("No se pudo inicializar Supabase:", e);
    }

    let rawFlota = [];
    let rawHistorial = [];
    let config = { filtro: 'todos', base: 'todas', query: '' };
    const DIAS_LIMITE = 7;

    function setEstado(texto, tipo) {
        const el = document.getElementById('status-text');
        el.className = 'rail-status' + (tipo ? ' ' + tipo : '');
        el.innerHTML = '<span class="dot"></span> ' + texto;
    }

    // Trae tbl_cambiobandeja paginando en bloques de 1000, más reciente primero
    // (así, al tomar el primer registro por unidad, es el más actual).
    async function cargarHistorial() {
        let todos = [];
        let desde = 0;
        const tam = 1000;
        let hayMas = true;

        while (hayMas) {
            const { data, error } = await db
                .from('tbl_cambiobandeja')
                .select('fecha_hora, numero_economico, bandeja_sube, bandeja_baja')
                .order('fecha_hora', { ascending: false })
                .range(desde, desde + tam - 1);

            if (error) throw error;

            todos = todos.concat(data);
            hayMas = data.length === tam;
            desde += tam;
        }
        return todos;
    }

    async function cargarFlota() {
        const { data, error } = await db.from('tbl_flota').select('autobus, estatus, base');
        if (error) throw error;
        return data;
    }

    async function init() {
        if (!db) {
            setEstado("Sin conexión a BD", "error");
            return;
        }
        try {
            setEstado("Conectando...", "");
            const [flota, historial] = await Promise.all([cargarFlota(), cargarHistorial()]);
            rawFlota = flota;
            rawHistorial = historial;
            crearMenuBases();
            render();
            setEstado("Datos actualizados", "ok");
        } catch (e) {
            console.error("Error en init:", e);
            setEstado("Error de conexión", "error");
        }
    }

    function crearMenuBases() {
        const bases = [...new Set(rawFlota.map(u => u.base))].filter(b => b).sort();

        const menu = document.getElementById('listaBasesMenu');
        if (menu) {
            menu.innerHTML = "";
            bases.forEach(b => {
                menu.insertAdjacentHTML('beforeend', `
                    <div class="side-item" onclick="setBase('${b}', this)">
                        <span><i class="fa-solid fa-location-dot"></i> ${b}</span>
                    </div>
                `);
            });
        }

        const picker = document.getElementById('mobBasePicker');
        if (picker) {
            bases.forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'mob-base-pill';
                btn.textContent = b;
                btn.onclick = () => setMobBase(b, btn);
                picker.appendChild(btn);
            });
        }
    }

    function setMobBase(b, el) {
        document.querySelectorAll('.mob-base-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        config.base = b;
        render();
    }

    function syncInputs(val) {
        document.getElementById('macSearch').value = val;
        config.query = val.toUpperCase();
        render();
    }

    function setFiltro(f, el) {
        config.filtro = f;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + f)?.classList.add('active');
        if (el) {
            document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }
        render();
    }

    function setBase(b, el) {
        config.base = b;
        document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function render() {
        const grid = document.getElementById('mainGrid');
        if (!grid) return;

        grid.innerHTML = "";

        let criticosTotal = 0;
        const estadoActualBuses = {};
        const listaParaOrdenar = [];

        // 1. Mapeo de estados (rawHistorial ya viene del más reciente al más antiguo)
        rawHistorial.forEach(fila => {
            const eco = fila.numero_economico ? fila.numero_economico.toString().trim() : null;
            if (!eco) return;
            if (!estadoActualBuses[eco]) {
                const bSube = (fila.bandeja_sube || "").toString().trim();
                const bBaja = (fila.bandeja_baja || "").toString().trim();
                if (bSube !== "") {
                    estadoActualBuses[eco] = { registro: fila, tieneDisco: true };
                } else if (bBaja !== "") {
                    estadoActualBuses[eco] = { registro: fila, tieneDisco: false };
                }
            }
        });

        // 2. Lista unificada contra el catálogo de flota
        rawFlota.forEach(unidad => {
            const busId = unidad.autobus ? unidad.autobus.toString().trim() : null;
            if (!busId) return;

            const infoActual = estadoActualBuses[busId];
            let dias = -1;
            let fechaUnix = 0;

            if (infoActual && infoActual.tieneDisco) {
                const fechaInst = new Date(infoActual.registro.fecha_hora);
                fechaUnix = fechaInst.getTime();
                dias = Math.floor((new Date() - fechaInst) / 864e5);
            }

            listaParaOrdenar.push({
                busId,
                base: unidad.base || 'N/D',
                estatus: unidad.estatus || 'S/E',
                dias,
                fechaUnix,
                discoData: infoActual && infoActual.tieneDisco ? infoActual.registro : null
            });
        });

        // 3. Ordenar: sin disco al final, resto por antigüedad de instalación
        listaParaOrdenar.sort((a, b) => {
            if (a.dias === -1 && b.dias !== -1) return 1;
            if (a.dias !== -1 && b.dias === -1) return -1;
            return a.fechaUnix - b.fechaUnix;
        });

        // 4. Renderizar
        listaParaOrdenar.forEach(item => {
            if (config.query && !item.busId.includes(config.query)) return;
            if (config.base !== 'todas' && item.base !== config.base) return;

            let tipo = "vacio";
            let pct = 0;
            if (item.dias !== -1) {
                pct = Math.min((item.dias / DIAS_LIMITE) * 100, 100);
                tipo = pct >= 90 ? "critico" : (pct >= 65 ? "alerta" : "seguro");
                if (tipo === "critico") criticosTotal++;
            }

            if (config.filtro === 'critico' && tipo !== 'critico') return;
            if (config.filtro === 'vacio' && tipo !== 'vacio') return;

            const color = tipo === 'critico' ? 'var(--rust)' : (tipo === 'alerta' ? 'var(--amber)' : (tipo === 'vacio' ? 'var(--gris)' : 'var(--teal)'));
            const pillBg = tipo === 'critico' ? 'var(--rust-tint)' : (tipo === 'alerta' ? 'var(--amber-tint)' : (tipo === 'vacio' ? 'var(--gris-tint)' : 'var(--teal-tint)'));
            const pillTxt = color;

            const bandeja = item.discoData ? item.discoData.bandeja_sube : '---';
            const fecha = item.discoData ? new Date(item.discoData.fecha_hora).toLocaleDateString('es-MX', { timeZone: 'America/Mexico_City' }) : 'Sin dato';
            const diasTxt = item.dias === -1 ? '-' : item.dias + ' días';

            grid.insertAdjacentHTML('beforeend', `
                <div class="row-item ${item.dias === -1 ? 'row-vacio' : ''}">

                    <div class="cell-bus">${item.busId}</div>
                    <div class="cell-bandeja">${bandeja}</div>
                    <div class="progress-wrap">
                        <div class="progress-head" style="color:${color}">
                            <span>${tipo.toUpperCase()}</span>
                            <span>${item.dias === -1 ? '0%' : Math.round(pct) + '%'}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${pct}%; background:${color};"></div>
                        </div>
                    </div>
                    <div class="cell-base">${item.base}</div>
                    <div class="cell-dias ${item.dias >= 6 ? 'critico' : ''}">${diasTxt}</div>
                    <div class="cell-fecha">${fecha}</div>

                    <div class="card-mob-header">
                        <div class="cell-bus">${item.busId}</div>
                        <span class="mob-status-pill" style="background:${pillBg}; color:${pillTxt}">${tipo.toUpperCase()}</span>
                    </div>

                    <div class="card-mob-progress">
                        <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; font-weight:700; color:${color}; margin-bottom:6px;">
                            <span>Riesgo de sobreescritura</span>
                            <span>${item.dias === -1 ? '0%' : Math.round(pct) + '%'}</span>
                        </div>
                        <div class="progress-bar" style="height:8px;">
                            <div class="progress-fill" style="width:${pct}%; background:${color};"></div>
                        </div>
                    </div>

                    <div class="card-mob-grid">
                        <div class="card-mob-cell">
                            <span class="card-mob-label">Bandeja</span>
                            <span class="card-mob-value">${bandeja}</span>
                        </div>
                        <div class="card-mob-cell">
                            <span class="card-mob-label">Base</span>
                            <span class="card-mob-value">${item.base}</span>
                        </div>
                        <div class="card-mob-cell">
                            <span class="card-mob-label">Días a bordo</span>
                            <span class="card-mob-value" style="color:${item.dias >= 6 ? 'var(--rust)' : 'var(--ink)'}">${diasTxt}</span>
                        </div>
                        <div class="card-mob-cell">
                            <span class="card-mob-label">Se subió el</span>
                            <span class="card-mob-value" style="color:var(--ink-soft); font-size:12.5px;">${fecha}</span>
                        </div>
                    </div>

                </div>
            `);
        });

        document.getElementById('badgeCritico').innerText = criticosTotal;
    }

    init();
</script>
</body>
</html>
