<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Pendientes WF · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-box">
      <div class="login-brand">
        <div class="mark">WF</div>
        <h1>Pendientes WF</h1>
        <p>Seguimiento de bitácoras del accidente</p>
      </div>

      <div class="login-card">
        <form id="form-login">
          <div id="form-error" class="form-error" style="display:none;"></div>

          <div class="field">
            <label for="clave">Clave de colaborador</label>
            <input id="clave" type="text" autocomplete="username" autocapitalize="characters" placeholder="10203040" required autofocus />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>

          <button id="btn-submit" class="btn-primary" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./assets/login.js"></script>
</body>
</html>
