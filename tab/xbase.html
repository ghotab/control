<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Distribución por Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-auth.js"></script>

    <style>
        :root {
            --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb;
            --ink: #111827; --ink-soft: #6b7280;
            --violet: #6d5fd8; --violet-tint: #efedfc;
            --teal: #14b8a6; --teal-tint: #e6f9f6;
            --red: #ef4444; --red-tint: #fde9e9;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--ink); }
        :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

        .header {
            padding: 24px 20px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
            position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }

        .header-title { display: flex; align-items: center; gap: 10px; }
        .app-logo {
            width: 34px; height: 34px; border-radius: 9px; background: var(--violet);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

        #contadorBuses {
            background: var(--violet-tint); color: var(--violet); padding: 5px 13px;
            border-radius: 20px; font-size: 12.5px; font-weight: 700; display: none;
        }

        .selector-container { width: 100%; max-width: 400px; position: relative; }

        select {
            width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); font-size: 15px; appearance: none; cursor: pointer; outline: none;
            font-family: 'Inter', sans-serif; color: var(--ink);
        }
        select:focus { border-color: var(--violet); }

        .selector-container::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--violet); pointer-events: none; font-size: 13px;
        }

        .grid-container {
            display: grid; padding: 22px; gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            max-width: 1400px; margin: 0 auto;
        }

        .card {
            background: var(--surface); border-radius: 12px; padding: 18px;
            border: 1px solid var(--border); border-left: 3px solid var(--violet);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(17,24,39,0.06); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .bus-number { font-size: 25px; font-weight: 800; color: var(--ink); line-height: 1; }

        .rol-tag { font-size: 10.5px; font-weight: 700; padding: 4px 10px; background: var(--violet-tint); color: var(--violet); border-radius: 8px; text-transform: uppercase; }
        .status-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; display: inline-block; margin-top: 6px; }
        .status-ok { background: var(--teal-tint); color: #0a7d6f; }
        .status-bad { background: var(--red-tint); color: #b91c1c; }

        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .label { color: var(--ink-soft); font-weight: 500; }
        .val { font-weight: 600; }

        .divider { height: 1px; background: var(--border); margin: 12px 0; }

        .loading-overlay { text-align: center; padding: 90px 20px; color: var(--ink-soft); font-weight: 500; }
        .loading-overlay i { color: var(--violet); }
        .loading-overlay p { margin-top: 12px; }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-title">
            <div class="app-logo"><i class="fa-solid fa-industry"></i></div>
            <h1>Distribución por Base</h1>
        </div>

        <div id="contadorBuses">
            <i class="fa-solid fa-bus"></i> <span id="numBuses">0</span> autobuses en esta base
        </div>

        <div class="selector-container">
            <select id="selectBase" onchange="renderizarPorBase()">
                <option value="">Sincronizando bases...</option>
            </select>
        </div>
    </div>

    <div id="mainContainer">
        <div id="loader" class="loading-overlay">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p>Consultando catálogo de flota...</p>
        </div>
        <div class="grid-container" id="gridBuses"></div>
    </div>

    <script>
        // usar cliente centralizado y exigir sesión
        const db = window.db;
        (async function(){ try { if (window.supabaseAuth) await window.supabaseAuth.requireAuth(); } catch(e){ console.error(e); } })();

        let flotaCompleta = [];

        async function inicializar() {
            if (!db) {
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;">Sin conexión con la base de datos.</p>';
                return;
            }

            try {
                const { data, error } = await db
                    .from('tbl_flota')
                    .select('autobus, rol, estatus, base, no_serie, anio, marca, modelo, centro_costos, sociedad')
                    .order('autobus', { ascending: true });

                if (error) throw error;

                flotaCompleta = data;

                const bases = [...new Set(flotaCompleta.map(f => f.base))]
                    .filter(b => b && b.toString().trim() !== "")
                    .sort();

                const select = document.getElementById('selectBase');
                select.innerHTML = '<option value="">-- Selecciona una Base --</option>' +
                    bases.map(b => `<option value="${b}">${b}</option>`).join('');

                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;">Error al conectar con la base de datos.</p>';
            }
        }

        function renderizarPorBase() {
            const baseSel = document.getElementById('selectBase').value;
            const grid = document.getElementById('gridBuses');
            const cont = document.getElementById('contadorBuses');
            const num = document.getElementById('numBuses');

            if (!baseSel) { grid.innerHTML = ''; cont.style.display = 'none'; return; }

            const filtrados = flotaCompleta.filter(f => f.base === baseSel);

            num.innerText = filtrados.length;
            cont.style.display = 'inline-flex';

            if (filtrados.length === 0) {
                grid.innerHTML = '<div class="loading-overlay">No hay buses asignados a esta base.</div>';
                return;
            }

            grid.innerHTML = filtrados.map(f => {
                const esOk = (f.estatus || "").toUpperCase() === "ENROLADO";
                const pillClass = esOk ? "status-ok" : "status-bad";

                return `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <span class="bus-number">${f.autobus || '—'}</span>
                            <span class="status-pill ${pillClass}">${f.estatus || 'S/E'}</span>
                        </div>
                        <span class="rol-tag">${f.rol || '—'}</span>
                    </div>

                    <div class="data-row"><span class="label">Sociedad</span><span class="val">${f.sociedad || '—'}</span></div>

                    <div class="divider"></div>

                    <div class="data-row"><span class="label">Marca / Modelo</span><span class="val">${f.marca || '—'} · ${f.modelo || '—'}</span></div>
                    <div class="data-row"><span class="label">Año</span><span class="val">${f.anio || '—'}</span></div>

                    <div class="divider"></div>

                    <div class="data-row"><span class="label">No. de Serie</span><span class="val">${f.no_serie || '—'}</span></div>
                    <div class="data-row"><span class="label">C. Costos</span><span class="val">${f.centro_costos || '—'}</span></div>
                </div>
            `;
            }).join('');
        }

        window.onload = inicializar;
    </script>
</body>

</html>
