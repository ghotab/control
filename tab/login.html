<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Bandejas — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --page-bg: #f4f5f7;
      --panel-light: #f6f7f9;
      --panel-dark: #05070a;
      --card-dark: #0d1118;
      --text-dark: #14191f;
      --text-soft: #5f6975;
      --line: rgba(15, 23, 42, 0.12);
      --accent: #1d9bf0;
      --accent-strong: #0b7ad9;
      --button: #2e6ef7;
      --button-hover: #1f5bd6;
      --field: #ffffff;
      --field-border: #dfe5ea;
      --shadow: 0 24px 60px rgba(13, 16, 19, 0.12);
      --promo-text: #f5f7fb;
      --promo-muted: #b8c0cc;
      --promo-accent: #5aa9ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--page-bg);
      color: var(--text-dark);
    }

    .page-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
    }

    .panel-left {
      background: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 36px 32px;
    }

    .login-box {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 58px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      color: #111827;
      background: linear-gradient(145deg, #dfe7ef, #f8fafc);
      box-shadow: inset 0 0 0 1px rgba(17,24,39,0.04);
    }

    .brand-name {
      font-size: clamp(2.1rem, 2.4vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: #111827;
      line-height: 0.9;
    }

    .form-title {
      font-size: clamp(2.2rem, 2.6vw, 3.5rem);
      font-weight: 500;
      letter-spacing: -0.06em;
      color: #1f2937;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 0.95rem;
      color: #475569;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #7b8794;
      font-size: 1rem;
    }

    .field-input {
      width: 100%;
      height: 62px;
      border-radius: 12px;
      border: 1px solid var(--field-border);
      background: rgba(255,255,255,0.75);
      color: var(--text-dark);
      padding: 0 18px 0 48px;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-input::placeholder {
      color: #8a93a0;
    }

    .field-input:focus {
      border-color: rgba(46, 110, 247, 0.69);
      box-shadow: 0 0 0 4px rgba(46, 110, 247, 0.08);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #778293;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #2d7df6, #235eea);
      color: white;
      font-weight: 700;
      font-size: 1.04rem;
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
      box-shadow: 0 12px 28px rgba(33, 98, 232, 0.2);
    }

    .btn:hover { filter: brightness(1.02); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    #error-msg {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid rgba(220, 38, 38, 0.2);
      background: rgba(239, 68, 68, 0.06);
      color: #b91c1c;
      padding: 12px 14px;
      font-size: 0.92rem;
    }

    #error-msg.show { display: flex; }

    .help-row {
      margin-top: 22px;
      text-align: center;
      color: #5b6673;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .help-row a {
      color: var(--button);
      text-decoration: none;
      font-weight: 600;
    }

    .panel-right {
      background: #04070b;
      padding: 64px 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .panel-right::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(82, 150, 255, 0.14), transparent 38%);
      pointer-events: none;
    }

    .promo {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      color: var(--promo-text);
    }

    .promo-badge {
      width: 230px;
      margin: 0 auto 28px;
      height: 150px;
      border-radius: 18px;
      background: linear-gradient(135deg, #202b3b, #0d121a);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .promo-badge::before {
      content: "BEST SOFTWARE";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .promo-badge::after {
      content: "2025";
      position: absolute;
      top: 46px;
      right: 24px;
      color: rgba(255,255,255,0.7);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }

    .award {
      width: 134px;
      height: 84px;
      background: linear-gradient(135deg, #facc15, #f59e0b, #ef4444);
      border-radius: 16px 16px 10px 10px;
      transform: rotate(-4deg);
      position: relative;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.12);
    }

    .award::before {
      content: "#1";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.4rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.06em;
    }

    .promo-visual {
      width: 100%;
      max-width: 470px;
      height: 270px;
      position: relative;
      margin: 0 auto 24px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      background: linear-gradient(180deg, rgba(148,163,184,0.12), rgba(148,163,184,0.03));
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .bus {
      position: absolute;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      width: 70%;
      height: 124px;
      background: linear-gradient(180deg, #e6ebf3, #b7c3d0 25%, #e2e8f0 70%, #c9d4e0);
      border-radius: 18px 18px 26px 26px;
      box-shadow: 0 20px 42px rgba(0,0,0,0.45);
      border: 1px solid rgba(15, 23, 42, 0.2);
    }

    .bus::before {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      top: 22px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(40, 90, 170, 0.2), rgba(9, 157, 255, 0.45), rgba(17, 24, 39, 0.25));
    }

    .bus::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      height: 26px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(17,24,39,0.82), rgba(51,65,85,0.8));
    }

    .camera {
      position: absolute;
      width: 82px;
      height: 56px;
      background: linear-gradient(180deg, #0f172a, #1f2937);
      border-radius: 17px;
      right: 70px;
      top: 80px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .camera::before {
      content: "";
      position: absolute;
      inset: 10px 12px 10px 12px;
      border-radius: 12px;
      background: radial-gradient(circle at 50% 50%, #38bdf8 0 18%, #0f172a 19% 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .camera::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      right: 14px;
      bottom: 12px;
      box-shadow: 0 0 16px rgba(56,189,248,0.8);
    }

    .wheel {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      bottom: 12px;
      background: radial-gradient(circle at center, #dbe3ec 0 30%, #111827 31% 45%, #dbe3ec 46% 100%);
      border: 2px solid rgba(15,23,42,0.68);
    }

    .wheel.left { left: 78px; }
    .wheel.right { right: 78px; }

    .promo h2 {
      text-align: center;
      font-size: clamp(2.1rem, 2.6vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: -0.06em;
      margin-bottom: 18px;
      font-weight: 500;
      color: rgba(245,247,251,0.98);
    }

    .promo-copy {
      color: rgba(184, 192, 204, 0.92);
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 480px;
      margin: 0 auto;
    }

    .promo-copy p {
      margin-top: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 100%;
    }

    .check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-top: 4px;
      background: rgba(59, 130, 246, 0.18);
      color: #7dd3fc;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .promo-copy strong {
      color: rgba(255,255,255,0.92);
      font-weight: 600;
    }

    .promo-help {
      margin-top: 26px;
      color: rgba(255,255,255,0.72);
      text-align: left;
      font-size: 1.04rem;
    }

    @media (max-width: 980px) {
      .page-shell {
        grid-template-columns: 1fr;
      }

      .panel-left {
        padding: 28px 18px 18px;
      }

      .panel-right {
        display: none;
      }

      .login-box {
        max-width: 100%;
      }

      .brand {
        margin-bottom: 26px;
      }

      .brand-name {
        font-size: 2.2rem;
      }

      .form-title {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 560px) {
      .panel-left {
        background: #070b11;
      }

      .brand-name, .form-title {
        color: #f6f8fb;
      }

      .field label {
        color: #d7dfe8;
      }

      .field-input {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.08);
        color: #f8fafc;
      }

      .field-input::placeholder {
        color: rgba(255,255,255,0.62);
      }

      .help-row {
        color: rgba(255,255,255,0.72);
      }

      .btn {
        background: linear-gradient(180deg, #3a8dff, #215fe8);
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="panel-left">
      <div class="login-box">
        <div class="brand">
          <div class="brand-mark">T</div>
          <div class="brand-name">Tecnología a Bordo</div>
        </div>

        <div id="login-form-wrap">
          <h1 class="form-title">Ingrese a su cuenta</h1>

          <div id="error-msg"><i class="fa-solid fa-triangle-exclamation"></i><span id="error-txt">Credenciales incorrectas.</span></div>

          <div class="field">
            <label for="clave">Colaborador</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user"></i>
              <input id="clave" type="text" class="field-input" placeholder="Ej. 1005043" autocomplete="username">
            </div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input id="password" type="password" class="field-input" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="toggle-pass" onclick="togglePass()" id="toggle-pass-btn" title="Mostrar contraseña"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
            </div>
          </div>

          <button class="btn" id="btn-login"><i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesión</button>
        </div>

        <div class="help-row">
          <span>Grupo Herradura - Occidente.</span>
        </div>
      </div>
    </div>

    <div class="panel-right" aria-hidden="true">
      <div class="promo">
        

        <div class="promo-visual">
          <div class="camera"></div>
          <div class="bus"></div>
          <div class="wheel left"></div>
          <div class="wheel right"></div>
          <div class="road"></div>
        </div>

        <h2>Bienvenido a Tecnología a Bordo.</h2>

        <div class="promo-copy">
          <p><span class="check"><i class="fa-solid fa-check"></i></span><span>Consultas de la <strong>Distribución</strong>.</span></p>
        </div>

        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-auth.js"></script>
  <script>
   function getRedirect() { const params = new URLSearchParams(window.location.search); return params.get('redirect') || 'index.html'; }

    const btn = document.getElementById('btn-login');
    const errBox = document.getElementById('error-msg');
    const errTxt = document.getElementById('error-txt');

    async function handleLogin() {
      const clave = document.getElementById('clave').value.trim();
      const password = document.getElementById('password').value;
      errBox.classList.remove('show');
      document.getElementById('clave').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!clave) {
        document.getElementById('clave').classList.add('error');
        errTxt.textContent = 'Ingresa tu clave de colaborador.';
        errBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span style="display:inline-block;animation:spin .7s linear infinite"><i class="fa-solid fa-circle-notch"></i></span> Verificando...';

      try {
        const res = await window.supabaseAuth.signInWithCollab(clave, password);
        if (res.error) throw res.error;

        try {
          const profile = await window.supabaseAuth.getProfile();
          if (profile && profile.clave_colaborador) localStorage.setItem('tecnico', profile.clave_colaborador);
          if (profile && profile.nombre) localStorage.setItem('nombre_tecnico', profile.nombre);
          if (profile && profile.base) localStorage.setItem('base', profile.base);
          if (profile && profile.perfil) localStorage.setItem('rol', profile.perfil);
        } catch (e) { /* ignore */ }

        window.location.href = getRedirect();
      } catch (e) {
        console.error(e);
        errTxt.textContent = (e && e.message) ? e.message : 'Error autenticando.';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesión';
      }
    }

    function togglePass() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    btn.addEventListener('click', handleLogin);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    window.addEventListener('DOMContentLoaded', () => {
      const clave = localStorage.getItem('tecnico');
      if (clave) {
        const dest = getRedirect();
        if (dest) window.location.href = dest;
      }
    });
  </script>
</body>

</html>
