<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Distribución por Rol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-auth.js"></script>

    <style>
        :root {
            --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb;
            --ink: #111827; --ink-soft: #6b7280;
            --violet: #6d5fd8; --violet-tint: #efedfc;
            --teal: #14b8a6; --teal-tint: #e6f9f6;
            --red: #ef4444; --red-tint: #fde9e9;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--ink); }
        :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

        .header {
            padding: 24px 20px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
            position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }

        .header-title { display: flex; align-items: center; gap: 10px; }
        .app-logo {
            width: 34px; height: 34px; border-radius: 9px; background: var(--violet);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

        #contadorBuses {
            font-size: 12.5px; color: var(--ink-soft); font-weight: 600; display: none;
            background: var(--violet-tint); padding: 5px 13px; border-radius: 20px;
        }
        #contadorBuses span { color: var(--violet); font-weight: 700; }

        .selector-container { width: 100%; max-width: 400px; position: relative; }

        select {
            width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); font-size: 15px; appearance: none; cursor: pointer; outline: none;
            box-shadow: 0 1px 3px rgba(17,24,39,0.04); font-family: 'Inter', sans-serif; color: var(--ink);
        }
        select:focus { border-color: var(--violet); }

        .selector-container::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--violet); pointer-events: none; font-size: 13px;
        }

        .grid-container {
            display: grid; padding: 20px; gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            max-width: 1400px; margin: 0 auto;
        }

        .card {
            background: var(--surface); border-radius: 12px; padding: 18px;
            border: 1px solid var(--border); border-left: 3px solid var(--violet);
            animation: fadeIn .25s ease-out both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); margin-bottom: 12px; padding-bottom: 10px;
        }
        .bus-number { font-size: 22px; font-weight: 800; color: var(--violet); }
        .service-tag { font-size: 11px; font-weight: 700; padding: 4px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--ink-soft); }

        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .label { color: var(--ink-soft); font-weight: 500; }
        .val { font-weight: 600; text-align: right; }

        .status-inline-ok { color: #0a7d6f; }
        .status-inline-bad { color: #b91c1c; }

        .divider { height: 1px; background: var(--border); margin: 10px 0; }

        .loading-overlay { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
        .loading-overlay i { color: var(--violet); }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-title">
            <div class="app-logo"><i class="fa-solid fa-route"></i></div>
            <h1>Distribución por Rol</h1>
        </div>

        <div id="contadorBuses">
            <span id="numBuses">0</span> autobuses en este rol
        </div>

        <div class="selector-container">
            <select id="selectRol" onchange="renderizarPorRol()">
                <option value="">Cargando roles...</option>
            </select>
        </div>
    </div>

    <div id="mainContainer">
        <div id="loader" class="loading-overlay">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p>Consultando catálogo de flota...</p>
        </div>
        <div class="grid-container" id="gridBuses"></div>
    </div>

    <script>
        // usar cliente centralizado y exigir sesión
        const db = window.db;
        (async function(){ try { if (window.supabaseAuth) await window.supabaseAuth.requireAuth(); } catch(e){ console.error(e); } })();

        let flotaCompleta = [];

        async function inicializar() {
            if (!db) {
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;">Sin conexión con la base de datos.</p>';
                return;
            }

            try {
                const { data, error } = await db
                    .from('tbl_flota')
                    .select('autobus, rol, estatus, base, no_serie, anio, marca, modelo, centro_costos, sociedad, servicio')
                    .order('autobus', { ascending: true });

                if (error) throw error;

                flotaCompleta = data;

                const roles = [...new Set(flotaCompleta.map(f => f.rol))]
                    .filter(r => r && r.toString().trim() !== "")
                    .sort();

                const select = document.getElementById('selectRol');
                select.innerHTML = '<option value="">-- Selecciona un Rol --</option>' +
                    roles.map(r => `<option value="${r}">${r}</option>`).join('');

                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;">Error de conexión.</p>';
            }
        }

        function renderizarPorRol() {
            const rolSeleccionado = document.getElementById('selectRol').value;
            const grid = document.getElementById('gridBuses');
            const divContador = document.getElementById('contadorBuses');
            const spanNum = document.getElementById('numBuses');

            if (!rolSeleccionado) {
                grid.innerHTML = '';
                divContador.style.display = 'none';
                return;
            }

            const filtrados = flotaCompleta.filter(f => f.rol === rolSeleccionado);

            spanNum.innerText = filtrados.length;
            divContador.style.display = 'inline-flex';

            if (filtrados.length === 0) {
                grid.innerHTML = '<div class="loading-overlay">No hay buses asignados a este rol.</div>';
                return;
            }

            grid.innerHTML = filtrados.map(f => {
                const esOk = (f.estatus || "").toUpperCase() === "ENROLADO";
                const claseEstatus = esOk ? "status-inline-ok" : "status-inline-bad";

                return `
                <div class="card">
                    <div class="card-header">
                        <span class="bus-number">${f.autobus || '—'}</span>
                        <span class="service-tag">${f.servicio || '—'}</span>
                    </div>

                    <div class="data-row"><span class="label">Sociedad</span><span class="val">${f.sociedad || '—'}</span></div>
                    <div class="data-row"><span class="label">Estatus</span><span class="val ${claseEstatus}">${f.estatus || 'S/E'}</span></div>
                    <div class="data-row"><span class="label">Base</span><span class="val" style="color: var(--violet);">${f.base || '—'}</span></div>

                    <div class="divider"></div>

                    <div class="data-row"><span class="label">Marca</span><span class="val">${f.marca || '—'}</span></div>
                    <div class="data-row"><span class="label">Modelo</span><span class="val">${f.modelo || '—'}</span></div>
                    <div class="data-row"><span class="label">Año</span><span class="val">${f.anio || '—'}</span></div>

                    <div class="divider"></div>

                    <div class="data-row"><span class="label">Serie</span><span class="val">${f.no_serie || '—'}</span></div>
                    <div class="data-row"><span class="label">CECO</span><span class="val">${f.centro_costos || '—'}</span></div>
                </div>
            `;
            }).join('');
        }

        window.onload = inicializar;
    </script>
</body>

</html>
